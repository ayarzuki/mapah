<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mapah.id</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100%; width: 100%; }
        html, body { height: 100%; margin: 0; }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex h-screen bg-gray-50">
    <!-- Sidebar -->
    <div class="w-1/3 flex flex-col h-full bg-white shadow-xl z-10 relative">
        <div class="p-6 border-b">
            <h1 class="text-3xl font-bold text-gray-800">mapah.id</h1>
            <p class="text-gray-500 text-sm mt-2">Evaluate business viability by location instantly.</p>
        </div>
        
        <div class="p-6 flex-1 overflow-y-auto">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">1. Enter Business Category or Name</label>
                <input type="text" id="category" value="Coffee Shop" placeholder="e.g., Indomaret, Coffee Shop, Education..." class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">2. Click on the Map to drop a pin</label>
                <div class="bg-gray-100 rounded p-3 text-sm text-gray-600 border border-gray-200">
                    <span id="location-text">No location selected</span>
                </div>
            </div>

            <button id="analyze-btn" disabled class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed shadow-md">
                Analyze Viability
            </button>

            <div id="result-container" class="mt-8 hidden">
                <div class="bg-blue-50 rounded-xl p-5 border border-blue-200 animate-fade-in-up">
                    <div class="text-center mb-6">
                        <div class="text-sm text-blue-600 font-bold uppercase tracking-widest">Viability Score</div>
                        <div id="score" class="text-6xl font-black text-blue-900 mt-2"></div>
                    </div>
                    
                    <h3 class="font-bold text-gray-800 mb-3 border-b border-blue-200 pb-2">SWOT Analysis</h3>
                    <div class="space-y-4">
                        <div>
                            <span class="text-green-600 font-bold text-sm uppercase flex items-center"><span class="mr-2">▲</span> Strengths</span>
                            <ul id="swot-strengths" class="list-disc list-inside text-sm text-gray-700 mt-1 pl-2"></ul>
                        </div>
                        <div>
                            <span class="text-red-500 font-bold text-sm uppercase flex items-center"><span class="mr-2">▼</span> Weaknesses</span>
                            <ul id="swot-weaknesses" class="list-disc list-inside text-sm text-gray-700 mt-1 pl-2"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Map -->
    <div class="flex-1 h-full relative">
        <div id="map" class="z-0"></div>
    </div>

    <script>
        const map = L.map('map', {zoomControl: false}).setView([-6.2415, 106.8123], 14);
        L.control.zoom({position: 'topright'}).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let currentPin = null;
        let competitorPins = [];
        let selectedLat = null;
        let selectedLng = null;

        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const blueIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        map.on('click', function(e) {
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;
            
            if (currentPin) {
                map.removeLayer(currentPin);
            }
            currentPin = L.marker([selectedLat, selectedLng], {icon: blueIcon}).addTo(map).bindPopup('<b>Target Location</b>').openPopup();
            map.flyTo([selectedLat, selectedLng], 15);
            
            document.getElementById('location-text').innerHTML = `<b>Lat:</b> ${selectedLat.toFixed(5)} <br><b>Lng:</b> ${selectedLng.toFixed(5)}`;
            document.getElementById('analyze-btn').disabled = false;
            document.getElementById('result-container').classList.add('hidden');
            
            competitorPins.forEach(p => map.removeLayer(p));
            competitorPins = [];
        });

        document.getElementById('analyze-btn').addEventListener('click', async () => {
            const btn = document.getElementById('analyze-btn');
            btn.innerText = 'Analyzing Area...';
            btn.disabled = true;

            const category = document.getElementById('category').value;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat: selectedLat, lng: selectedLng, category: category })
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                // Show Results
                document.getElementById('result-container').classList.remove('hidden');
                document.getElementById('score').innerText = data.score;
                
                // Color score
                const scoreEl = document.getElementById('score');
                if(data.score >= 80) scoreEl.className = "text-6xl font-black text-green-600 mt-2";
                else if(data.score >= 50) scoreEl.className = "text-6xl font-black text-yellow-500 mt-2";
                else scoreEl.className = "text-6xl font-black text-red-600 mt-2";
                
                document.getElementById('swot-strengths').innerHTML = data.swot.strengths.map(s => `<li>${s}</li>`).join('');
                document.getElementById('swot-weaknesses').innerHTML = data.swot.weaknesses.map(s => `<li>${s}</li>`).join('');

                // Draw Competitors
                competitorPins.forEach(p => map.removeLayer(p));
                competitorPins = [];

                data.competitors.forEach(comp => {
                    const marker = L.marker([comp.lat, comp.lng], {icon: redIcon}).addTo(map)
                                   .bindPopup(`<b>Competitor:</b> ${comp.name}`);
                    competitorPins.push(marker);
                });

            } catch (err) {
                alert('Error connecting to backend API.');
                console.error(err);
            } finally {
                btn.innerText = 'Analyze Viability';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
